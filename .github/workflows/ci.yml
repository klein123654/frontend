name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - name: Type-check
        run: npx vue-tsc --build

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build-only

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The live DeepSeek tests (tests/ai-features.spec.ts) need a local backend,
      # so CI runs the mocked end-to-end suites only.
      - name: End-to-end tests
        run: npx playwright test --project=chromium tests/e2e tests/smoke.spec.ts tests/coverage.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
