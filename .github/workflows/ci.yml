name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - name: Type-check
        run: npx vue-tsc --build

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build-only

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    # Official image with all Playwright browsers and their system packages
    # pre-installed (installing them with --with-deps can hang on apt).
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The live DeepSeek tests (tests/ai-features.spec.ts) need a local backend
      # with an API key, so CI runs the mocked end-to-end suites on every browser.
      - name: End-to-end tests
        run: npx playwright test tests/e2e tests/smoke.spec.ts tests/coverage.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
